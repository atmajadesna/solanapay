<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#8875DA">
<title>Dompetin — e-Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">

  <!-- ============ HEADER ============ -->
  <header class="app-header">
    <div class="greet">
      <span class="greet-small">Selamat datang,</span>
      <strong id="userName">Bos Desna</strong>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnNotif" aria-label="Notifikasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="dot"></span>
      </button>
      <button class="avatar" id="btnProfile" aria-label="Profil">AD</button>
    </div>
  </header>

  <main class="app-body">

    <!-- ============ SALDO ============ -->
    <section class="balance-card">
      <div class="balance-top">
        <span class="balance-label">Saldo Dompetin</span>
        <button class="eye-btn" id="toggleBalance" aria-label="Sembunyikan saldo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <h1 class="balance-amount" id="balanceText">Rp 1.250.000</h1>
      <div class="balance-bottom">
        <span class="pill">+ Rp 25.000 poin</span>
        <span class="card-num">•••• 4821</span>
      </div>
    </section>

    <!-- ============ AKSI CEPAT ============ -->
    <section class="actions">
      <button class="action" data-act="topup">
        <span class="action-icon ic-topup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </span>
        <span>Top Up</span>
      </button>
      <button class="action" data-act="transfer">
        <span class="action-icon ic-transfer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
        <span>Transfer</span>
      </button>
      <button class="action" data-act="qris">
        <span class="action-icon ic-qris">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h6"/></svg>
        </span>
        <span>QRIS</span>
      </button>
      <button class="action" data-act="withdraw">
        <span class="action-icon ic-withdraw">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7 7 7-7"/></svg>
        </span>
        <span>Tarik</span>
      </button>
    </section>

    <!-- ============ PROMO ============ -->
    <section class="promo" id="promoCard">
      <div class="promo-text">
        <strong>Cashback 10%</strong>
        <span>Bayar pakai QRIS sampai 31 Okt</span>
      </div>
      <button class="promo-btn" data-act="qris">Pakai</button>
    </section>

    <!-- ============ RIWAYAT SINGKAT ============ -->
    <section class="history">
      <div class="section-head">
        <h2>Transaksi Terakhir</h2>
        <button class="link-btn" data-act="history">Lihat semua</button>
      </div>
      <ul class="tx-list" id="txList"><!-- diisi JS --></ul>
    </section>

  </main>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="bottom-nav">
    <button class="nav-item is-active" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Beranda</span>
    </button>
    <button class="nav-item" data-nav="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
      <span>Riwayat</span>
    </button>
    <button class="nav-item" data-nav="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span>Profil</span>
    </button>
  </nav>
</div>

<!-- ============ MODAL SHELL ============ -->
<div class="sheet-backdrop" id="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/app.js"></script>
</body>
</html>
